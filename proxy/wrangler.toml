name = "capsule-proxy"
main = "worker.js"
compatibility_date = "2026-11-01"

# Run `npx wrangler kv namespace create USAGE` and paste the id it prints here.
[[kv_namespaces]]
binding = "USAGE"
id = "PASTE_KV_NAMESPACE_ID_HERE"

[vars]
# Where the app is opened from: your GitHub Pages site + the Android app (+ local dev).
ALLOWED_ORIGINS = "https://hudie-061.github.io,https://localhost,http://localhost:5173"
# Models are fixed here; the app cannot choose them.
TEXT_MODEL = "gemini-3.1-flash-lite"
IMAGE_MODEL = "gemini-3.1-flash-image"
# Per person per day
DAILY_TEXT_LIMIT = "150"
DAILY_IMAGE_LIMIT = "25"
# Everyone together per calendar month (~$0.067 per image => 140 images ≈ $10 of AI Pro credits)
MONTHLY_IMAGE_BUDGET = "140"
