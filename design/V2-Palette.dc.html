<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>v2 · Моя палитра</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E1B18}a:hover{color:#6B6259}
button{cursor:pointer}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.pop{animation:pop .3s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:rise .3s ease-out both}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4EFE7; color: #1E1B18; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 52px 20px 28px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="V2-Today.dc.html" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E5DACB; background: #FFFDF9; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(30, 27, 24, 0.08)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="font-size: 12px; color: #6B6259">по фото от 16 ноября</span>
</div>
<h1 style="margin: 12px 0 14px; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1">Моя палитра</h1>
<div style="background: #1E1B18; color: #F4EFE7; border-radius: 28px; padding: 18px; box-shadow: 0 18px 36px rgba(30, 27, 24, 0.25); display: flex; flex-direction: column; gap: 14px; height: 470px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; background: #3A342E; border: 2px solid #C9A24A; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#CFC6BA" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 3px">
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; line-height: 1">Мягкая осень</span>
<span style="font-size: 13px; color: #CFC6BA">тёплый подтон · средний контраст</span>
</div>
</div>
<div role="tablist" aria-label="Раздел палитры" style="position: relative; height: 40px; background: #2E2924; border-radius: 14px; padding: 4px; box-sizing: border-box; display: flex">
<div style="position: absolute; top: 4px; bottom: 4px; width: calc(50% - 4px); left: {{tabLeft}}; background: #F4EFE7; border-radius: 10px; transition: left 0.35s cubic-bezier(.2, .8, .2, 1)"></div>
<button role="tab" aria-selected="{{colorsSel}}" onClick="{{showColors}}" style="position: relative; flex: 1; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: {{colorsFg}}; transition: color 0.3s">Цвета</button>
<button role="tab" aria-selected="{{jewelSel}}" onClick="{{showJewel}}" style="position: relative; flex: 1; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: {{jewelFg}}; transition: color 0.3s">Металлы и украшения</button>
</div>
<sc-if value="{{isColors}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 600; color: #CFC6BA">Твои лучшие цвета</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 8px">
<sc-for list="{{best}}" as="c" hint-placeholder-count="8">
<div class="pop" style="display: flex; flex-direction: column; align-items: center; gap: 5px; animation-delay: {{c.delay}}">
<span style="width: 100%; height: 50px; border-radius: 14px; background: {{c.hex}}; border: 1px solid rgba(244, 239, 231, 0.15)"></span>
<span style="font-size: 11px; color: #E6DED2">{{c.name}}</span>
</div>
</sc-for>
</div>
<span style="font-size: 13px; font-weight: 600; color: #CFC6BA; margin-top: 4px">Лучше избегать у лица</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{avoid}}" as="c" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
<span style="position: relative; width: 100%; height: 34px; border-radius: 12px; background: {{c.hex}}; overflow: hidden">
<svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 70 34" preserveAspectRatio="none" style="position: absolute; left: 0; top: 0"><path d="M0 34 L70 0" stroke="#1E1B18" stroke-width="3"></path></svg>
</span>
<span style="font-size: 11px; color: #CFC6BA">{{c.name}}</span>
</div>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{isJewel}}" hint-placeholder-val="{{false}}">
<div class="rise" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; background: #2E2924; border-radius: 18px; padding: 12px 14px">
<div style="display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 12px; color: #CFC6BA">Твой металл</span>
<span style="font-size: 16px; font-weight: 700">Золото и бронза</span>
</div>
<div style="display: flex; gap: 6px; align-items: center">
<span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 15px; background: #C9A24A"></span>
<span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 15px; background: #9C6B3C"></span>
<span aria-hidden="true" style="position: relative; width: 30px; height: 30px; border-radius: 15px; background: #C0C4C8; overflow: hidden"><svg width="30" height="30" viewBox="0 0 30 30" style="position: absolute; left: 0; top: 0"><path d="M4 26 L26 4" stroke="#1E1B18" stroke-width="3"></path></svg></span>
</div>
</div>
<span style="font-size: 13px; font-weight: 600; color: #CFC6BA">Подойдут тебе</span>
<sc-for list="{{jewels}}" as="j" hint-placeholder-count="4">
<div class="rise" style="display: flex; align-items: center; gap: 12px; animation-delay: {{j.delay}}">
<span aria-hidden="true" style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; background: #2E2924; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9A24A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.4 5.6L20 9.5l-4.3 3.9L17 19l-5-3-5 3 1.3-5.6L4 9.5l5.6-.9Z"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600">{{j.name}}</span>
<span style="font-size: 12px; color: #CFC6BA">{{j.note}}</span>
</span>
</div>
</sc-for>
</div>
</sc-if>
<div style="flex: 1"></div>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #CFC6BA">
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 18px; color: #F4EFE7">Капсула</span>
<span>Фото при дневном свете, без фильтров</span>
</div>
</div>
<div style="flex: 1"></div>
<div style="display: flex; gap: 10px">
<button style="flex: 1; min-height: 52px; border-radius: 26px; border: 1px solid #1E1B18; background: transparent; color: #1E1B18; display: flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"></path><path d="M5 13v7h14v-7"></path></svg>В сторис</button>
<a href="V2-Shopping.dc.html" style="flex: 2; min-height: 52px; border-radius: 26px; background: #1E1B18; color: #F4EFE7; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; box-shadow: 0 8px 18px rgba(30, 27, 24, 0.25)">Найти вещи в моих цветах</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tab: 'colors' };
}
renderVals() {
var self = this;
var j = this.state.tab === 'jewel';
var best = [
['Карамель', '#B07A4F'], ['Олива', '#6F6B3E'], ['Терракота', '#A8553A'], ['Кэмел', '#C19A6B'],
['Шоколад', '#5A3B2A'], ['Шалфей', '#9AA58A'], ['Тёплый беж', '#D8C3A5'], ['Бордо', '#6E2A2F']
];
var avoid = [['Ледяной голубой', '#BFE3F2'], ['Фуксия', '#D63C8C'], ['Неон-лайм', '#C6F432'], ['Холодный серый', '#A7B0BA']];
var jewels = [
{ name: 'Часы на коричневом ремешке', note: 'Кожа, золотистый корпус' },
{ name: 'Цепь средней толщины', note: 'Под ворот оверсайз-футболки' },
{ name: 'Кольцо-печатка', note: 'Матовое золото' },
{ name: 'Очки в черепаховой оправе', note: 'Тёплые оттенки у лица' }
];
return {
isColors: !j,
isJewel: j,
tabLeft: j ? '50%' : '4px',
colorsSel: j ? 'false' : 'true',
jewelSel: j ? 'true' : 'false',
colorsFg: j ? '#CFC6BA' : '#1E1B18',
jewelFg: j ? '#1E1B18' : '#CFC6BA',
showColors: function () { self.setState({ tab: 'colors' }); },
showJewel: function () { self.setState({ tab: 'jewel' }); },
best: best.map(function (c, i) { return { name: c[0], hex: c[1], delay: (i * 0.04) + 's' }; }),
avoid: avoid.map(function (c) { return { name: c[0], hex: c[1] }; }),
jewels: jewels.map(function (x, i) { return { name: x.name, note: x.note, delay: (i * 0.06) + 's' }; })
};
}
}
</script>
</body>
</html>
